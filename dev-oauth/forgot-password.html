<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>TubeMind AI DEV | Recover password</title>
<style>body{font:16px system-ui;background:#0b1022;color:#f4f7ff;min-height:100vh;display:grid;place-items:center;margin:0}.panel{width:min(420px,calc(100% - 48px));padding:28px;background:#151d36;border:1px solid #283554;border-radius:18px;box-shadow:0 20px 65px #0005}h1{font-size:26px;margin:0 0 12px}p{line-height:1.55;color:#b9c7e1}label{display:block;margin-top:22px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:10px 0;border-radius:9px;font:inherit}input{border:1px solid #54617d;background:#0b1022;color:#fff}button{border:0;background:#78a6ff;color:#101629;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.brand{color:#78a6ff;font-weight:800;letter-spacing:.4px;margin-bottom:18px}.status{min-height:30px}</style></head>
<body><main class="panel"><div class="brand">TubeMind AI <small>DEV</small></div><h1>Forgot your password?</h1><p>Enter the email address linked to your TubeMind AI account. We'll send a secure link to create a new password.</p><form id="recover"><label for="email">Email address</label><input id="email" type="email" name="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required><button id="submit" type="submit">Send reset link</button></form><p class="status" id="status" role="status" aria-live="polite"></p><p style="font-size:13px">If you signed up using Google, choose Continue with Google in the extension.</p></main>
<script type="module" src="./forgot-password.js"></script></body></html>
