<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>TubeMind AI DEV | Reset password</title>
<style>body{font:16px system-ui;background:#0b1022;color:#f4f7ff;min-height:100vh;display:grid;place-items:center;margin:0}.panel{width:min(400px,calc(100% - 48px));padding:28px;background:#151d36;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:9px;font:inherit}input{border:1px solid #54617d;background:#0b1022;color:#fff}button{border:0;background:#78a6ff;color:#101629;font-weight:650;cursor:pointer}button:disabled{opacity:.55}p{line-height:1.5}</style></head>
<body><main class="panel"><h1>Set a new password</h1><p>TubeMind AI 0.3.0 DEV account recovery</p><form id="reset" hidden><label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256" required></label><button id="submit" type="submit">Save new password</button></form><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="./reset-password.js"></script></body></html>
