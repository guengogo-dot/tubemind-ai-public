<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>TubeMind AI DEV | Reset password</title>
<style>body{font:16px system-ui;background:#0b1022;color:#f4f7ff;min-height:100vh;display:grid;place-items:center;margin:0}.panel{width:min(400px,calc(100% - 48px));padding:28px;background:#151d36;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:9px;font:inherit}input{border:1px solid #54617d;background:#0b1022;color:#fff}button{border:0;background:#78a6ff;color:#101629;font-weight:650;cursor:pointer}button:disabled{opacity:.55}.password-field{position:relative}.password-field input{padding-right:48px}.password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;margin:0;padding:8px;display:grid;place-items:center;border:0;background:transparent;color:#a9b7d2;border-radius:8px}.password-toggle:hover,.password-toggle:focus-visible{color:#fff;background:#283554;outline:2px solid transparent}.password-toggle svg{width:20px;height:20px}p{line-height:1.5}</style></head>
<body><main class="panel"><h1>Set a new password</h1><p>TubeMind AI 0.3.0 DEV account recovery</p><form id="reset" hidden><label>New password<span class="password-field" style="display:block"><input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="256" required><button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18" hidden/></svg></button></span></label><label>Confirm password<span class="password-field" style="display:block"><input name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="256" required><button type="button" class="password-toggle" data-target="confirm" aria-label="Show confirmation password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18" hidden/></svg></button></span></label><button id="submit" type="submit">Save new password</button></form><p id="status" role="status" aria-live="polite"></p></main><script>document.querySelectorAll(".password-toggle").forEach(button=>{button.addEventListener("click",()=>{const input=document.querySelector('input[name="'+button.dataset.target+'"]');const visible=input.type==="password";input.type=visible?"text":"password";button.setAttribute("aria-pressed",String(visible));button.setAttribute("aria-label",(visible?"Hide":"Show")+" password");button.title=(visible?"Hide":"Show")+" password";button.querySelector(".eye-slash").hidden=!visible;});});</script><script type="module" src="./reset-password.js"></script></body></html>
